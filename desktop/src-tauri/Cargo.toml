[package]
name = "website-generator-desktop"
version = "0.1.0"
description = "Operator desktop for the Website Generator"
authors = ["Effingham Office Maids"]
edition = "2024"

[lib]
name = "website_generator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.1"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tempfile = "3.27.0"
