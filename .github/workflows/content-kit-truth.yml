name: Content Kit Truth Audit

on:
  pull_request:
    paths:
      - "content-pipeline/resolution-audit/**"
      - "plans/PR-Resolution-Audit-*.md"
      - ".github/workflows/content-kit-truth.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Resolution Audit product truth sync
        run: python content-pipeline/resolution-audit/sync_product_truth.py --check
      - name: Validate Resolution Audit evidence freshness
        run: python content-pipeline/resolution-audit/validate_evidence.py --fail-on-stale
      - name: Audit Resolution Audit content kit truth
        run: python content-pipeline/resolution-audit/audit_content_kit_truth.py
