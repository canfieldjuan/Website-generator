name: Generator Tests

on:
  pull_request:
    paths:
      - "build.py"
      - "pipeline.py"
      - "connect_provider.py"
      - "desktop/**"
      - "lib/**"
      - "references/**"
      - "scripts/start_llama_server.sh"
      - "scripts/start_vllm_server.sh"
      - "scripts/build_connect_provider.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/generator-tests.yml"
  push:
    branches: [main]
    paths:
      - "build.py"
      - "pipeline.py"
      - "connect_provider.py"
      - "desktop/**"
      - "lib/**"
      - "references/**"
      - "scripts/start_llama_server.sh"
      - "scripts/start_vllm_server.sh"
      - "scripts/build_connect_provider.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/generator-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: canfieldjuan/connect-contracts
          ref: c5405935bd1354cf6a4c8539425a53dfd7f52949
          path: connect-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        env:
          CONNECT_CONTRACTS_DIR: ${{ github.workspace }}/connect-contracts
      - run: python -m compileall -q build.py pipeline.py connect_provider.py lib tests

  windows-connect-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: canfieldjuan/connect-contracts
          ref: 3005d82a7be885fba36f8688b5967a5b56a0abea
          path: connect-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: pip install -r requirements-dev.txt -r requirements-release.txt
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Run native Windows storage and package tests
        run: >-
          python -m unittest -v
          tests.test_connect_windows
          tests.test_connect_release_build
        env:
          CONNECT_CONTRACTS_DIR: ${{ github.workspace }}/connect-contracts
      - name: Build official Windows provider
        run: python scripts/build_connect_provider.py
        env:
          LOCAL_CONNECT_ENTITLEMENT_KEYRING_FILE: ${{ github.workspace }}/connect-contracts/entitlements/v1/release/keyring.json
      - name: Verify packaged authority and activation adapter
        shell: pwsh
        run: |
          $output = & .\dist\website-redesign-connect.exe entitlement status
          if ($LASTEXITCODE -ne 0) { throw "Packaged entitlement status failed" }
          $status = $output | ConvertFrom-Json
          if ($status.state -ne "missing" -or $status.active -ne $false) {
            throw "Packaged authority did not report the expected missing state"
          }
      - name: Bundle engine into desktop application
        shell: pwsh
        run: Copy-Item .\dist\website-redesign-connect.exe .\desktop\src-tauri\resources\website-redesign-connect.exe
      - name: Build native Windows installer
        run: npm run tauri build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: website-generator-windows
          path: |
            dist/website-redesign-connect.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
